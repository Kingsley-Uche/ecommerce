name: Laravel Build & Deploy to cPanel

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_mysql, xml, bcmath, fileinfo

      # Install Composer dependencies
      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install Node dependencies
      - name: Install NPM dependencies
        run: npm ci

      # Build frontend assets
      - name: Build frontend assets
        run: npm run build

      # Verify build
      - name: Verify build output
        run: ls -la public/build

      # Upload Vite build
      - name: Upload Vite build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "public/build/"
          strip_components: 1
          target: "${{ secrets.DEPLOY_PATH }}/ecommerce/public/build"

      # Deploy Laravel
      - name: Deploy Laravel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.DEPLOY_PATH }}/ecommerce

            echo "Cleaning repository..."
            git clean -fd -e .env

            echo "Updating repository..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing Composer packages..."
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

            echo "Replacing old frontend build..."
            echo "Replacing old frontend build..."

            rm -rf /home/${{ secrets.SERVER_USER }}/public_html/build/*
            cp -a public/build/. /home/${{ secrets.SERVER_USER }}/public_html/build/

            echo "Refreshing storage symlink..."
            rm -rf public/storage
            php artisan storage:link

            echo "Optimizing Laravel..."
            php artisan optimize:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            chmod -R 775 storage bootstrap/cache

            echo "Deployment completed successfully."