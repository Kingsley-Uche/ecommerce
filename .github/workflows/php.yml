name: Laravel Build & Deploy to cPanel

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, xml, bcmath, fileinfo


      # Install Composer dependencies
      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader


      # Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # Install npm
      - name: Install NPM dependencies
        run: npm ci


      # Build assets
      - name: Build frontend assets
        run: npm run build


      # Verify build
      - name: Verify build output
        run: ls -la public/build


      # Remove old frontend build on server
      - name: Remove old frontend assets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -e

            echo "Removing old frontend assets..."

            rm -rf ${{ secrets.DEPLOY_PATH }}/ecommerce/public/admin-assets
            rm -rf ${{ secrets.DEPLOY_PATH }}/ecommerce/public/assets
            rm -rf ${{ secrets.DEPLOY_PATH }}/ecommerce/public/build

            mkdir -p ${{ secrets.DEPLOY_PATH }}/ecommerce/public/build

            echo "Old assets removed"


      # Upload new Vite build
      - name: Upload Vite build assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          source: "public/build/*"
          target: "${{ secrets.DEPLOY_PATH }}/ecommerce/public/build"


      # Deploy Laravel
      - name: Deploy Laravel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m

          script: |

            set -e

            cd ${{ secrets.DEPLOY_PATH }}/ecommerce


            echo "Cleaning repository..."
            git clean -fd -e .env


            echo "Updating repository..."
            git fetch origin main
            git reset --hard origin/main


            echo "Installing Composer packages..."
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader


            echo "Refreshing storage link..."
            rm -rf public/storage
            php artisan storage:link


            echo "Optimizing Laravel..."

            php artisan optimize:clear
            php artisan route:clear
            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            

            chmod -R 775 storage bootstrap/cache


            echo "Deployment completed successfully"